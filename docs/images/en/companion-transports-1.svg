<svg style="width:100%;margin:1rem 0" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
<style>
:root{--bg:#FFFFFF; --grid:#023E8A; --line:#0096C7; --wave:#0096C7; --node:#0077B6; --outer:#0096C7; --text-primary:#0a2540; --text-secondary:#3d6380; --text-muted:#7a9bb5; --link-color:#0077B6; --link-hover:#023E8A; --heading-color:#0077B6; --border-subtle:rgba(0,119,182,0.12); --card-bg:rgba(0,119,182,0.03); --card-border:rgba(0,119,182,0.12); --card-hover:rgba(0,119,182,0.07); --code-bg:rgba(0,119,182,0.04); --code-border:rgba(0,119,182,0.12); --info-bg:rgba(0,119,182,0.04); --info-border:rgba(0,119,182,0.15); --table-header:rgba(0,119,182,0.06); --table-row-alt:rgba(0,119,182,0.02); --table-border:rgba(0,119,182,0.1); --timeline-line:#0096C7; --timeline-dot:#0077B6; --tag-green:rgba(16,185,129,0.1); --tag-green-text:#059669; --tag-red:rgba(239,68,68,0.08); --tag-red-text:#dc2626; --flow-hw:#b45309; --flow-hw-edge:#92400e; --flow-hw-fill:#fef3c7; --flow-hw-tint:#fffbeb; --flow-hw-text-soft:#78350f; --flow-hw-text-italic:#a16207; --flow-hw-divider:#d6a55c; --flow-sw:#1e40af; --flow-sw-edge:#1e3a8a; --flow-sw-fill:#dbeafe; --flow-sw-tint:#eff6ff; --flow-sw-divider:#93b8ff; --flow-warn:#b91c1c; --flow-warn-fill:#fee2e2; --flow-ok:#15803d; --flow-ink:#1c1917; --flow-ink-soft:#57534e; --flow-ink-mute:#78716c; --flow-bg-wait:#fafaf7; --flow-interface-bg:#f5f5f4; --flow-paper:#ffffff;}
@media (prefers-color-scheme: dark){:root{--bg:#0A1628; --grid:#0077B6; --line:#0077B6; --wave:#48CAE4; --node:#00B4D8; --outer:#0077B6; --text-primary:#e0f0f8; --text-secondary:#8badc4; --text-muted:#4a6a80; --link-color:#48CAE4; --link-hover:#90E0EF; --heading-color:#48CAE4; --border-subtle:rgba(0,119,182,0.15); --card-bg:rgba(0,119,182,0.06); --card-border:rgba(0,119,182,0.15); --card-hover:rgba(0,119,182,0.12); --code-bg:rgba(0,119,182,0.08); --code-border:rgba(0,119,182,0.2); --info-bg:rgba(72,202,228,0.06); --info-border:rgba(72,202,228,0.2); --table-header:rgba(0,119,182,0.1); --table-row-alt:rgba(0,119,182,0.04); --table-border:rgba(0,119,182,0.12); --timeline-line:#0077B6; --timeline-dot:#00B4D8; --tag-green:rgba(16,185,129,0.15); --tag-green-text:#6ee7b7; --tag-red:rgba(239,68,68,0.12); --tag-red-text:#fca5a5; --flow-hw:#b45309; --flow-hw-edge:#92400e; --flow-hw-fill:#fef3c7; --flow-hw-tint:#fffbeb; --flow-hw-text-soft:#78350f; --flow-hw-text-italic:#a16207; --flow-hw-divider:#d6a55c; --flow-sw:#1e40af; --flow-sw-edge:#1e3a8a; --flow-sw-fill:#dbeafe; --flow-sw-tint:#eff6ff; --flow-sw-divider:#93b8ff; --flow-warn:#b91c1c; --flow-warn-fill:#fee2e2; --flow-ok:#15803d; --flow-ink:#1c1917; --flow-ink-soft:#57534e; --flow-ink-mute:#78716c; --flow-bg-wait:#fafaf7; --flow-interface-bg:#f5f5f4; --flow-paper:#ffffff;}}
</style>
<rect x="0" y="0" width="700" height="300" fill="var(--bg)"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs>
<text x="20" y="26" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="var(--link-color)" text-anchor="start" letter-spacing="1.5">ONE FRAME, THREE TRANSPORTS</text>
<rect x="180" y="40" width="340" height="50" rx="6" fill="var(--info-bg)" stroke="var(--info-border)" stroke-width="1.5"/>
<text x="350" y="62" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="var(--link-color)" text-anchor="middle">MyMesh — command in, response out</text>
<text x="350" y="80" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="400" fill="var(--text-muted)" text-anchor="middle">knows only frames, not the transport beneath</text>
<line x1="350" y1="92" x2="350" y2="118" stroke="var(--line)" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="180" y="120" width="340" height="40" rx="6" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5"/>
<text x="350" y="145" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="var(--link-color)" text-anchor="middle">BaseSerialInterface</text>
<line x1="350" y1="162" x2="120" y2="188" stroke="var(--line)" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="190" width="200" height="100" rx="6" fill="none" stroke="var(--border-subtle)" stroke-width="1.5"/>
<text x="36" y="212" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="var(--link-color)" text-anchor="start" letter-spacing="1.5">BLE</text>
<text x="36" y="234" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" fill="var(--text-secondary)" text-anchor="start">GATT with NUS</text>
<text x="36" y="254" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" fill="var(--text-secondary)" text-anchor="start">no length header</text>
<text x="36" y="274" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" fill="var(--text-secondary)" text-anchor="start">at least 60 ms</text>
<text x="36" y="294" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" fill="var(--text-secondary)" text-anchor="start">between two frames</text>
<line x1="350" y1="162" x2="350" y2="188" stroke="var(--line)" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="250" y="190" width="200" height="100" rx="6" fill="none" stroke="var(--border-subtle)" stroke-width="1.5"/>
<text x="266" y="212" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="var(--link-color)" text-anchor="start" letter-spacing="1.5">USB SERIAL</text>
<text x="266" y="234" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" fill="var(--text-secondary)" text-anchor="start">byte stream</text>
<text x="266" y="254" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" fill="var(--text-secondary)" text-anchor="start">header &gt; and &lt;</text>
<text x="266" y="274" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" fill="var(--text-secondary)" text-anchor="start">no connection</text>
<text x="266" y="294" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" fill="var(--text-secondary)" text-anchor="start">detection</text>
<line x1="350" y1="162" x2="580" y2="188" stroke="var(--line)" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="480" y="190" width="200" height="100" rx="6" fill="none" stroke="var(--border-subtle)" stroke-width="1.5"/>
<text x="496" y="212" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="var(--link-color)" text-anchor="start" letter-spacing="1.5">TCP PORT 5000</text>
<text x="496" y="234" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" fill="var(--text-secondary)" text-anchor="start">same header</text>
<text x="496" y="254" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" fill="var(--text-secondary)" text-anchor="start">as serial</text>
<text x="496" y="274" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" fill="var(--text-secondary)" text-anchor="start">one client at a time</text>
<text x="496" y="294" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" fill="var(--text-secondary)" text-anchor="start">a new one evicts the old</text>
</svg>