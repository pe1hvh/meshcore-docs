<svg style="width:100%;margin:1rem 0" viewBox="0 0 660 270" xmlns="http://www.w3.org/2000/svg">
<style>
:root{--bg:#FFFFFF; --grid:#023E8A; --line:#0096C7; --wave:#0096C7; --node:#0077B6; --outer:#0096C7; --text-primary:#0a2540; --text-secondary:#3d6380; --text-muted:#7a9bb5; --link-color:#0077B6; --link-hover:#023E8A; --heading-color:#0077B6; --border-subtle:rgba(0,119,182,0.12); --card-bg:rgba(0,119,182,0.03); --card-border:rgba(0,119,182,0.12); --card-hover:rgba(0,119,182,0.07); --code-bg:rgba(0,119,182,0.04); --code-border:rgba(0,119,182,0.12); --info-bg:rgba(0,119,182,0.04); --info-border:rgba(0,119,182,0.15); --table-header:rgba(0,119,182,0.06); --table-row-alt:rgba(0,119,182,0.02); --table-border:rgba(0,119,182,0.1); --timeline-line:#0096C7; --timeline-dot:#0077B6; --tag-green:rgba(16,185,129,0.1); --tag-green-text:#059669; --tag-red:rgba(239,68,68,0.08); --tag-red-text:#dc2626; --flow-hw:#b45309; --flow-hw-edge:#92400e; --flow-hw-fill:#fef3c7; --flow-hw-tint:#fffbeb; --flow-hw-text-soft:#78350f; --flow-hw-text-italic:#a16207; --flow-hw-divider:#d6a55c; --flow-sw:#1e40af; --flow-sw-edge:#1e3a8a; --flow-sw-fill:#dbeafe; --flow-sw-tint:#eff6ff; --flow-sw-divider:#93b8ff; --flow-warn:#b91c1c; --flow-warn-fill:#fee2e2; --flow-ok:#15803d; --flow-ink:#1c1917; --flow-ink-soft:#57534e; --flow-ink-mute:#78716c; --flow-bg-wait:#fafaf7; --flow-interface-bg:#f5f5f4; --flow-paper:#ffffff;}
@media (prefers-color-scheme: dark){:root{--bg:#0A1628; --grid:#0077B6; --line:#0077B6; --wave:#48CAE4; --node:#00B4D8; --outer:#0077B6; --text-primary:#e0f0f8; --text-secondary:#8badc4; --text-muted:#4a6a80; --link-color:#48CAE4; --link-hover:#90E0EF; --heading-color:#48CAE4; --border-subtle:rgba(0,119,182,0.15); --card-bg:rgba(0,119,182,0.06); --card-border:rgba(0,119,182,0.15); --card-hover:rgba(0,119,182,0.12); --code-bg:rgba(0,119,182,0.08); --code-border:rgba(0,119,182,0.2); --info-bg:rgba(72,202,228,0.06); --info-border:rgba(72,202,228,0.2); --table-header:rgba(0,119,182,0.1); --table-row-alt:rgba(0,119,182,0.04); --table-border:rgba(0,119,182,0.12); --timeline-line:#0077B6; --timeline-dot:#00B4D8; --tag-green:rgba(16,185,129,0.15); --tag-green-text:#6ee7b7; --tag-red:rgba(239,68,68,0.12); --tag-red-text:#fca5a5; --flow-hw:#b45309; --flow-hw-edge:#92400e; --flow-hw-fill:#fef3c7; --flow-hw-tint:#fffbeb; --flow-hw-text-soft:#78350f; --flow-hw-text-italic:#a16207; --flow-hw-divider:#d6a55c; --flow-sw:#1e40af; --flow-sw-edge:#1e3a8a; --flow-sw-fill:#dbeafe; --flow-sw-tint:#eff6ff; --flow-sw-divider:#93b8ff; --flow-warn:#b91c1c; --flow-warn-fill:#fee2e2; --flow-ok:#15803d; --flow-ink:#1c1917; --flow-ink-soft:#57534e; --flow-ink-mute:#78716c; --flow-bg-wait:#fafaf7; --flow-interface-bg:#f5f5f4; --flow-paper:#ffffff;}}
</style>
<rect x="0" y="0" width="660" height="270" fill="var(--bg)"/>
<text x="20" y="26" fill="var(--heading-color)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" letter-spacing="2">MCU AND RADIO: TWO COUPLINGS</text>
<rect x="20" y="46" width="140" height="150" rx="6" fill="var(--code-bg)" stroke="var(--code-border)" stroke-width="1.5"/>
<text x="34" y="72" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">MCU</text>
<text x="34" y="90" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="8">ESP32 / nRF52 / RP2040</text>
<rect x="250" y="46" width="120" height="150" rx="6" fill="var(--code-bg)" stroke="var(--code-border)" stroke-width="1.5"/>
<text x="264" y="72" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700">SX1262 (separate)</text>
<line x1="160" y1="104" x2="250" y2="104" stroke="var(--line)" stroke-width="1"/>
<text x="205" y="101" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="7" text-anchor="middle">MOSI</text>
<line x1="160" y1="119" x2="250" y2="119" stroke="var(--line)" stroke-width="1"/>
<text x="205" y="116" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="7" text-anchor="middle">MISO</text>
<line x1="160" y1="134" x2="250" y2="134" stroke="var(--line)" stroke-width="1"/>
<text x="205" y="131" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="7" text-anchor="middle">SCK</text>
<line x1="160" y1="149" x2="250" y2="149" stroke="var(--line)" stroke-width="1"/>
<text x="205" y="146" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="7" text-anchor="middle">NSS</text>
<line x1="160" y1="164" x2="250" y2="164" stroke="var(--line)" stroke-width="1"/>
<text x="205" y="161" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="7" text-anchor="middle">BUSY</text>
<line x1="160" y1="179" x2="250" y2="179" stroke="var(--line)" stroke-width="1"/>
<text x="205" y="176" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="7" text-anchor="middle">DIO1</text>
<text x="20" y="216" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="8">SPI_INTERFACES_COUNT = 1</text>
<text x="20" y="230" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="8">RADIO_CLASS = CustomSX1262</text>
<text x="20" y="248" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="9">six GPIO lines across the SPI bus</text>
<rect x="430" y="46" width="210" height="150" rx="6" fill="var(--info-bg)" stroke="var(--info-border)" stroke-width="1.5"/>
<text x="444" y="72" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">STM32WLE5</text>
<text x="444" y="90" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="8">STM32WL</text>
<rect x="470" y="108" width="150" height="62" rx="4" fill="var(--card-hover)" stroke="var(--card-border)" stroke-width="1.5"/>
<text x="484" y="134" fill="var(--link-color)" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700">SubGHz radio</text>
<text x="484" y="152" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="8">on the same die</text>
<text x="430" y="216" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="8">SPI_INTERFACES_COUNT = 0</text>
<text x="430" y="230" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="8">RADIO_CLASS = CustomSTM32WLx</text>
<text x="430" y="248" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="9">no SPI, no separate chip</text>
</svg>
