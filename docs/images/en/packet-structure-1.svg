<text x="195.0" y="216" fill="#0F6E56" font-family="'JetBrains Mono',monospace" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="central">transport_code_1</text>
<text x="195.0" y="236" fill="#0F6E56" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="400" text-anchor="middle" dominant-baseline="central">2 bytes</text>
<rect x="270" y="192" width="150" height="66" rx="5" fill="#D6E4F0" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="345.0" y="216" fill="#1F3864" font-family="'JetBrains Mono',monospace" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="central">transport_code_2</text>
<text x="345.0" y="236" fill="#1F3864" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="400" text-anchor="middle" dominant-baseline="central">2 bytes</text>
<rect x="420" y="192" width="110" height="66" rx="5" fill="#D6E4F0" stroke="#2E75B6" stroke-width="1.5"/>
<text x="475.0" y="216" fill="#1F3864" font-family="'JetBrains Mono',monospace" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="central">path_length</text>
<text x="475.0" y="236" fill="#1F3864" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="400" text-anchor="middle" dominant-baseline="central">1 byte</text>
<rect x="530" y="192" width="140" height="66" rx="5" fill="#D6E4F0" stroke="#2E75B6" stroke-width="1.5"/>
<text x="600.0" y="216" fill="#1F3864" font-family="'JetBrains Mono',monospace" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="central">path</text>
<text x="600.0" y="236" fill="#1F3864" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="400" text-anchor="middle" dominant-baseline="central">0-64 bytes</text>
<rect x="670" y="192" width="186" height="66" rx="5" fill="#FAE0E0" stroke="#8B0000" stroke-width="1.5"/>
<text x="763.0" y="216" fill="#8B0000" font-family="'JetBrains Mono',monospace" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="central">payload</text>
<text x="763.0" y="236" fill="#8B0000" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="400" text-anchor="middle" dominant-baseline="central">0-184 bytes</text>
<path d="M120,188 L120,178 L420,178 L420,188" fill="none" stroke="#7a9bb5" stroke-width="1.2"/>
<text x="270" y="170" fill="#7a9bb5" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="400" text-anchor="middle" dominant-baseline="central">only for route type 0x00 and 0x03</text>
<path d="M195.0,258 L195.0,288" fill="none" stroke="#1E6B3A" stroke-width="2"/>
<path d="M190.0,282 L195.0,289 L200.0,282" fill="none" stroke="#1E6B3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="80" y="292" width="300" height="46" rx="5" fill="#D9EFE2" stroke="#1E6B3A" stroke-width="2"/>
<text x="230" y="308" fill="#0F6E56" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central" letter-spacing="0.8">THIS IS WHERE THE REGION CODE SITS</text>
<text x="230" y="325" fill="#0F6E56" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" dominant-baseline="central">16 bits, derived from the region name</text>
<text x="24" y="382" fill="var(--text-primary)" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" text-anchor="start" dominant-baseline="central">Which layer provides which field</text>
<rect x="24" y="396" width="832" height="34" rx="5" fill="#FDE9D0" stroke="#BA7517" stroke-width="1.5"/>
<text x="38" y="413" fill="#7F4000" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" text-anchor="start" dominant-baseline="central">LoRa PHY  ·  SX1262 / SX1276 / LR1110</text>
<text x="360" y="413" fill="#7F4000" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="400" text-anchor="start" dominant-baseline="central">Preamble · Sync Word · PHY header · CRC</text>
<rect x="24" y="436" width="832" height="34" rx="5" fill="#D6E4F0" stroke="#2E75B6" stroke-width="1.5"/>
<text x="38" y="453" fill="#1F3864" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" text-anchor="start" dominant-baseline="central">MeshCore  ·  firmware on ESP32 / nRF52</text>
<text x="360" y="453" fill="#1F3864" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="400" text-anchor="start" dominant-baseline="central">header · transport codes · path_length · path · payload</text>
