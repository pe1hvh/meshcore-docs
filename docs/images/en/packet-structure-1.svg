<rect x="0" y="0" width="880" height="486" fill="var(--bg)"/>
<text x="440" y="26" fill="var(--heading-color)" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="central">What the radio chip provides, and what MeshCore provides</text>
<text x="24" y="48" fill="var(--link-color)" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" text-anchor="start" dominant-baseline="central" letter-spacing="1.6">THE COMPLETE LORA FRAME ON AIR</text>
<rect x="24" y="62" width="150" height="62" rx="5" fill="#FDE9D0" stroke="#BA7517" stroke-width="1.5"/>
<text x="99.0" y="86" fill="#7F4000" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">Preamble</text>
<text x="99.0" y="104" fill="#7F4000" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="400" text-anchor="middle" dominant-baseline="central">8 symbols</text>
<rect x="174" y="62" width="105" height="62" rx="5" fill="#FDE9D0" stroke="#BA7517" stroke-width="1.5"/>
<text x="226.5" y="86" fill="#7F4000" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">Sync Word</text>
<text x="226.5" y="104" fill="#7F4000" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="400" text-anchor="middle" dominant-baseline="central">private</text>
<rect x="279" y="62" width="120" height="62" rx="5" fill="#FDE9D0" stroke="#BA7517" stroke-width="1.5"/>
<text x="339.0" y="86" fill="#7F4000" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">PHY header</text>
<text x="339.0" y="104" fill="#7F4000" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="400" text-anchor="middle" dominant-baseline="central">len + CR</text>
<rect x="399" y="62" width="285" height="62" rx="5" fill="#D6E4F0" stroke="#2E75B6" stroke-width="2.5"/>
<text x="541.5" y="86" fill="#1F3864" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">MeshCore frame</text>
<text x="541.5" y="104" fill="#1F3864" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="400" text-anchor="middle" dominant-baseline="central">1-255 bytes</text>
<rect x="684" y="62" width="120" height="62" rx="5" fill="#FDE9D0" stroke="#BA7517" stroke-width="1.5"/>
<text x="744.0" y="86" fill="#7F4000" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">CRC-16</text>
<text x="744.0" y="104" fill="#7F4000" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="400" text-anchor="middle" dominant-baseline="central">error check</text>
<text x="24" y="144" fill="var(--text-secondary)" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" text-anchor="start" dominant-baseline="central">The radio chip wraps these fields around it by itself. The MeshCore firmware never sees them — not when sending, not when receiving.</text>
<path d="M399,124 L24,192" fill="none" stroke="#2E75B6" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M684,124 L856,192" fill="none" stroke="#2E75B6" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="24" y="152" fill="var(--link-color)" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" text-anchor="start" dominant-baseline="central" letter-spacing="1.6">THE MESHCORE FRAME EXPANDED</text>
<rect x="24" y="192" width="96" height="66" rx="5" fill="#D6E4F0" stroke="#2E75B6" stroke-width="1.5"/>
<text x="72.0" y="216" fill="#1F3864" font-family="'JetBrains Mono',monospace" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="central">header</text>
