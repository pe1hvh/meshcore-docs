</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs>
<rect x="0" y="0" width="700" height="400" fill="var(--bg)"/>
<rect x="230" y="20" width="240" height="56" rx="6" fill="var(--card-bg)" stroke="var(--node)" stroke-width="2"/>
<text x="350" y="44" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700">BaseSerialInterface</text>
<text x="350" y="63" text-anchor="middle" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">writeFrame() and checkRecvFrame(), 176 bytes</text>
<rect x="30" y="140" width="200" height="140" rx="6" fill="var(--flow-sw-fill)" stroke="var(--flow-sw-edge)" stroke-width="1.5"/>
<text x="130" y="166" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">SerialWifiInterface</text>
<text x="44" y="192" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">WIFI_SSID set</text>
<text x="44" y="212" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">TCP server</text>
<text x="44" y="232" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">port 5000</text>
<text x="44" y="252" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">17 lines, 15 dirs</text>
<line x1="130" y1="76" x2="130" y2="140" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="250" y="140" width="200" height="140" rx="6" fill="var(--flow-hw-fill)" stroke="var(--flow-hw-edge)" stroke-width="1.5"/>
<text x="350" y="166" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">SerialBLEInterface</text>
<text x="264" y="192" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">BLE_PIN_CODE set</text>
<text x="264" y="212" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">GATT service</text>
<text x="264" y="232" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">queue of 4</text>
<text x="264" y="252" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">PIN in firmware</text>
<line x1="350" y1="76" x2="350" y2="140" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="470" y="140" width="200" height="140" rx="6" fill="var(--code-bg)" stroke="var(--code-border)" stroke-width="1.5"/>
<text x="570" y="166" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">ArduinoSerialInterface</text>
<text x="484" y="192" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">neither</text>
<text x="484" y="212" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">cable</text>
<text x="484" y="232" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">&gt; and &lt; start byte</text>
<text x="484" y="252" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">always connected</text>
<line x1="570" y1="76" x2="570" y2="140" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="30" y="320" width="640" height="60" rx="6" fill="var(--code-bg)" stroke="var(--code-border)" stroke-width="1.5"/>
<text x="350" y="344" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">an #elif chain: exactly one of the three is compiled in</text>
<text x="350" y="364" text-anchor="middle" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">switching requires reflashing</text>
</svg>