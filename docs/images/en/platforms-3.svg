<rect x="0" y="0" width="660" height="330" fill="var(--bg)"/>
<text x="20" y="26" fill="var(--heading-color)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" letter-spacing="2">WHICH PLATFORM</text>
