<text x="34" y="208" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="8">yes</text>
<path d="M 170 184 L 170 212 L 255 212 L 255 240" fill="none" stroke="var(--line)" stroke-width="1.2"/>
<text x="182" y="208" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="8">no</text>
<path d="M 490 184 L 490 212 L 405 212 L 405 240" fill="none" stroke="var(--line)" stroke-width="1.2"/>
<text x="428" y="208" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="8">yes</text>
<path d="M 590 184 L 590 212 L 585 212 L 585 240" fill="none" stroke="var(--line)" stroke-width="1.2"/>
<text x="600" y="208" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="8">no</text>
