<text x="32" y="262" fill="var(--link-color)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">nRF52840</text>
<text x="32" y="278" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="8">lowest power, most BLE targets</text>
<rect x="190" y="240" width="130" height="46" rx="6" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5"/>
<text x="202" y="262" fill="var(--link-color)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">ESP32</text>
<text x="202" y="278" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="8">fastest, most peripherals</text>
<rect x="340" y="240" width="130" height="46" rx="6" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5"/>
<text x="352" y="262" fill="var(--link-color)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">ESP32</text>
<text x="352" y="278" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="8">fastest, most peripherals</text>
<rect x="520" y="240" width="120" height="46" rx="6" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5"/>
<text x="532" y="262" fill="var(--link-color)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">STM32WL</text>
<text x="532" y="278" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="8">only if you build and flash yourself</text>
<text x="20" y="316" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="8">RP2040: USB only, no display</text>
