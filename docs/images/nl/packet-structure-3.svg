<text x="44" y="450" fill="var(--text-primary)" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" text-anchor="start" dominant-baseline="central">De regiocode zit niet in het kanaal en niet in de payload</text>
<text x="44" y="470" fill="var(--text-secondary)" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="400" text-anchor="start" dominant-baseline="central">Hij wordt bij verzenden toegevoegd vanuit de default scope van de zendende node, buiten de versleutelde payload om.</text>
<text x="44" y="486" fill="var(--text-secondary)" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="400" text-anchor="start" dominant-baseline="central">Eén kanaal kan dus met verschillende scopes verstuurd worden, en een repeater filtert op de scope zonder ooit de PSK te kennen.</text>
