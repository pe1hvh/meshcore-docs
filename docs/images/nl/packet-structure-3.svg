<text x="468" y="276" fill="#8B0000" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" text-anchor="start" dominant-baseline="central" letter-spacing="1.2">KANAAL-PSK</text>
<text x="468" y="292" fill="#8B0000" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="400" text-anchor="start" dominant-baseline="central">"#zwolle", 16 bytes</text>
