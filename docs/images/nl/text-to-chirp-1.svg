<text fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="10" x="10" y="20">32 bits van "Test":</text>
<text fill="var(--text-primary)" font-family="'JetBrains Mono',monospace" font-size="11" x="10" y="45">0101 0100 0110  0101 0111 0011  0111 0100</text>
