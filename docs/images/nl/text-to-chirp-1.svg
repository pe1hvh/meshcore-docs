<text fill="var(--link-color)" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" text-anchor="middle" x="109" y="75">12 bits → Symbool 1</text>
<text fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="9" text-anchor="middle" x="109" y="92">= 1350</text>
<text fill="var(--timeline-dot)" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" text-anchor="middle" x="317" y="75">12 bits → Symbool 2</text>
<text fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="9" text-anchor="middle" x="317" y="92">= 1395</text>
<text fill="var(--node)" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" text-anchor="middle" x="492" y="75">8 bits → Symbool 3</text>
<text fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="9" text-anchor="middle" x="492" y="92">= 1860 (aangevuld)</text>
