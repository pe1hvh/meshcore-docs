<rect x="0" y="0" width="700" height="330" fill="var(--bg)"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs>
<text x="20" y="26" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="var(--link-color)" text-anchor="start" letter-spacing="1.5">VERBINDEN EN SYNCHRONISEREN</text>
<text x="120" y="52" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="var(--link-color)" text-anchor="middle">APP</text>
<text x="560" y="52" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="var(--link-color)" text-anchor="middle">NODE</text>
<line x1="120" y1="62" x2="120" y2="300" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="560" y1="62" x2="560" y2="300" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="122" y1="86" x2="558" y2="86" stroke="var(--line)" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="340" y="80" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="400" fill="var(--text-secondary)" text-anchor="middle">CMD_APP_START + naam van de app</text>
<line x1="558" y1="116" x2="122" y2="116" stroke="var(--line)" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="340" y="110" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="400" fill="var(--text-secondary)" text-anchor="middle">RESP_CODE_SELF_INFO</text>
<line x1="122" y1="146" x2="558" y2="146" stroke="var(--line)" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="340" y="140" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="400" fill="var(--text-secondary)" text-anchor="middle">CMD_DEVICE_QUERY + app_target_ver</text>
<line x1="558" y1="176" x2="122" y2="176" stroke="var(--line)" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="340" y="170" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="400" fill="var(--text-secondary)" text-anchor="middle">RESP_CODE_DEVICE_INFO + FIRMWARE_VER_CODE</text>
<line x1="122" y1="206" x2="558" y2="206" stroke="var(--line)" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="340" y="200" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="400" fill="var(--text-secondary)" text-anchor="middle">CMD_SET_DEVICE_TIME, CMD_GET_CONTACTS, CMD_GET_CHANNEL</text>
<line x1="558" y1="236" x2="122" y2="236" stroke="var(--line)" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="340" y="230" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="400" fill="var(--text-secondary)" text-anchor="middle">PUSH_CODE_MSG_WAITING</text>
<rect x="150" y="254" width="400" height="46" rx="6" fill="var(--info-bg)" stroke="var(--info-border)" stroke-width="1.5"/>
<text x="350" y="274" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="400" fill="var(--text-secondary)" text-anchor="middle">CMD_SYNC_NEXT_MESSAGE herhalen tot RESP_CODE_NO_MORE_MESSAGES</text>
<text x="350" y="290" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="400" fill="var(--text-muted)" text-anchor="middle">de node stuurt berichten nooit uit zichzelf — hij meldt alleen dat er iets klaarstaat</text>
</svg>