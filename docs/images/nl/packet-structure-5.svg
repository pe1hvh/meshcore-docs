<text x="44" y="448" fill="var(--text-primary)" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" text-anchor="start" dominant-baseline="central">De regiocode hangt af van de payload, niet alleen van de regio</text>
<text x="44" y="467" fill="var(--text-secondary)" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="400" text-anchor="start" dominant-baseline="central">Hij is een HMAC over payload type én payload. Twee kanalen met dezelfde scope krijgen dus verschillende codes, en twee opeenvolgende berichten op één kanaal ook.</text>
