<text x="120" y="90" fill="var(--link-color)" font-family="'JetBrains Mono',monospace" font-size="30" font-weight="700" text-anchor="middle">14</text>
<text x="120" y="118" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" text-anchor="middle">interfaceklassen</text>
<text x="120" y="146" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" text-anchor="middle">Alleen virtuele methoden</text>
<text x="120" y="166" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" text-anchor="middle">geen werkende code</text>
<rect x="250" y="45" width="200" height="150" rx="6" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5"/>
<text x="350" y="90" fill="var(--link-color)" font-family="'JetBrains Mono',monospace" font-size="30" font-weight="700" text-anchor="middle">50</text>
<text x="350" y="118" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" text-anchor="middle">implementatieklassen</text>
<text x="350" y="146" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" text-anchor="middle">Erft van een klasse</text>
<text x="350" y="166" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" text-anchor="middle">uit groep 1</text>
<rect x="480" y="45" width="200" height="150" rx="6" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5"/>
<text x="580" y="90" fill="var(--link-color)" font-family="'JetBrains Mono',monospace" font-size="30" font-weight="700" text-anchor="middle">55</text>
<text x="580" y="118" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" text-anchor="middle">zelfstandig</text>
<text x="580" y="146" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" text-anchor="middle">Geen contract,</text>
<text x="580" y="166" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" text-anchor="middle">vult er ook geen in</text>
<line x1="245" y1="120" x2="225" y2="120" stroke="var(--line)" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="215" width="660" height="55" rx="6" fill="var(--code-bg)" stroke="var(--code-border)" stroke-width="1.5"/>
<text x="350" y="240" fill="var(--link-color)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" text-anchor="middle">77 — variants/</text>
<text x="350" y="258" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" text-anchor="middle">65 borden · 7 sensorbeheer · 3 schermen · 2 entropiebronnen</text>
<line x1="350" y1="212" x2="350" y2="200" stroke="var(--line)" stroke-width="1.5" marker-end="url(#a)"/>
<text x="350" y="300" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" text-anchor="middle">119 + 77 = 196 klassen in de firmware</text>
