<svg style="width:100%;margin:1rem 0" viewBox="0 0 680 410" xmlns="http://www.w3.org/2000/svg">
<style>
:root{--bg:#FFFFFF; --grid:#023E8A; --line:#0096C7; --wave:#0096C7; --node:#0077B6; --outer:#0096C7; --text-primary:#0a2540; --text-secondary:#3d6380; --text-muted:#7a9bb5; --link-color:#0077B6; --link-hover:#023E8A; --heading-color:#0077B6; --border-subtle:rgba(0,119,182,0.12); --card-bg:rgba(0,119,182,0.03); --card-border:rgba(0,119,182,0.12); --card-hover:rgba(0,119,182,0.07); --code-bg:rgba(0,119,182,0.04); --code-border:rgba(0,119,182,0.12); --info-bg:rgba(0,119,182,0.04); --info-border:rgba(0,119,182,0.15); --table-header:rgba(0,119,182,0.06); --table-row-alt:rgba(0,119,182,0.02); --table-border:rgba(0,119,182,0.1); --timeline-line:#0096C7; --timeline-dot:#0077B6; --tag-green:rgba(16,185,129,0.1); --tag-green-text:#059669; --tag-red:rgba(239,68,68,0.08); --tag-red-text:#dc2626; --flow-hw:#b45309; --flow-hw-edge:#92400e; --flow-hw-fill:#fef3c7; --flow-hw-tint:#fffbeb; --flow-hw-text-soft:#78350f; --flow-hw-text-italic:#a16207; --flow-hw-divider:#d6a55c; --flow-sw:#1e40af; --flow-sw-edge:#1e3a8a; --flow-sw-fill:#dbeafe; --flow-sw-tint:#eff6ff; --flow-sw-divider:#93b8ff; --flow-warn:#b91c1c; --flow-warn-fill:#fee2e2; --flow-ok:#15803d; --flow-ink:#1c1917; --flow-ink-soft:#57534e; --flow-ink-mute:#78716c; --flow-bg-wait:#fafaf7; --flow-interface-bg:#f5f5f4; --flow-paper:#ffffff;}
@media (prefers-color-scheme: dark){:root{--bg:#0A1628; --grid:#0077B6; --line:#0077B6; --wave:#48CAE4; --node:#00B4D8; --outer:#0077B6; --text-primary:#e0f0f8; --text-secondary:#8badc4; --text-muted:#4a6a80; --link-color:#48CAE4; --link-hover:#90E0EF; --heading-color:#48CAE4; --border-subtle:rgba(0,119,182,0.15); --card-bg:rgba(0,119,182,0.06); --card-border:rgba(0,119,182,0.15); --card-hover:rgba(0,119,182,0.12); --code-bg:rgba(0,119,182,0.08); --code-border:rgba(0,119,182,0.2); --info-bg:rgba(72,202,228,0.06); --info-border:rgba(72,202,228,0.2); --table-header:rgba(0,119,182,0.1); --table-row-alt:rgba(0,119,182,0.04); --table-border:rgba(0,119,182,0.12); --timeline-line:#0077B6; --timeline-dot:#00B4D8; --tag-green:rgba(16,185,129,0.15); --tag-green-text:#6ee7b7; --tag-red:rgba(239,68,68,0.12); --tag-red-text:#fca5a5; --flow-hw:#b45309; --flow-hw-edge:#92400e; --flow-hw-fill:#fef3c7; --flow-hw-tint:#fffbeb; --flow-hw-text-soft:#78350f; --flow-hw-text-italic:#a16207; --flow-hw-divider:#d6a55c; --flow-sw:#1e40af; --flow-sw-edge:#1e3a8a; --flow-sw-fill:#dbeafe; --flow-sw-tint:#eff6ff; --flow-sw-divider:#93b8ff; --flow-warn:#b91c1c; --flow-warn-fill:#fee2e2; --flow-ok:#15803d; --flow-ink:#1c1917; --flow-ink-soft:#57534e; --flow-ink-mute:#78716c; --flow-bg-wait:#fafaf7; --flow-interface-bg:#f5f5f4; --flow-paper:#ffffff;}}
</style>
<defs><marker id="u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker><marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--flow-hw)"/></marker></defs>
<rect x="0" y="0" width="680" height="410" fill="var(--bg)"/>
<title>CLI van een repeater direct over USB, als tekst</title>
<rect x="55" y="14" width="150" height="34" rx="6" fill="var(--card-bg)" stroke="var(--node)" stroke-width="1.5"/>
<text x="130" y="36" text-anchor="middle" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="600">Terminal</text>
<line x1="130" y1="48" x2="130" y2="318" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="445" y="14" width="150" height="34" rx="6" fill="var(--card-bg)" stroke="var(--node)" stroke-width="1.5"/>
<text x="520" y="36" text-anchor="middle" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="600">Repeater</text>
<line x1="520" y1="48" x2="520" y2="318" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="12" y="64" width="656" height="24" rx="4" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1"/>
<text x="24" y="80" text-anchor="start" fill="var(--heading-color)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="600">Repeater-firmware aan USB: tekst, geen frames</text>
<line x1="142" y1="126" x2="520" y2="126" stroke="var(--line)" stroke-width="1.6" marker-end="url(#u)"/>
<circle cx="130" cy="126" r="9" fill="var(--bg)" stroke="var(--line)" stroke-width="1.4"/>
<text x="130" y="130" text-anchor="middle" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600">1</text>
<text x="325.0" y="119" text-anchor="middle" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">'v' 'e' 'r' en dan CR</text>
<text x="325.0" y="142" text-anchor="middle" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">teken voor teken, geen &lt; of &gt;</text>
<line x1="508" y1="176" x2="130" y2="176" stroke="var(--line)" stroke-width="1.6" marker-end="url(#u)"/>
<circle cx="520" cy="176" r="9" fill="var(--bg)" stroke="var(--line)" stroke-width="1.4"/>
<text x="520" y="180" text-anchor="middle" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600">2</text>
<text x="325.0" y="169" text-anchor="middle" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">elk teken terug (echo)</text>
<rect x="425.0" y="194" width="190" height="72" rx="5" fill="var(--flow-hw-fill)" stroke="var(--flow-hw-edge)" stroke-width="1"/>
<text x="520" y="211" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">bij CR:</text>
<text x="520" y="227" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">Serial.print('\n')</text>
<text x="520" y="243" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">handleCommand(0,</text>
<text x="520" y="259" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">command, reply)</text>
<circle cx="425.0" cy="230.0" r="9" fill="var(--bg)" stroke="var(--flow-hw-edge)" stroke-width="1.4"/>
<text x="425.0" y="234.0" text-anchor="middle" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600">3</text>
<line x1="508" y1="304" x2="130" y2="304" stroke="var(--line)" stroke-width="1.6" marker-end="url(#u)"/>
<circle cx="520" cy="304" r="9" fill="var(--bg)" stroke="var(--line)" stroke-width="1.4"/>
<text x="520" y="308" text-anchor="middle" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600">4</text>
<text x="325.0" y="297" text-anchor="middle" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">'  -&gt; ' en het antwoord</text>
<text x="325.0" y="320" text-anchor="middle" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">alleen als reply niet leeg is</text>
<rect x="12" y="340" width="656" height="54" rx="5" fill="var(--code-bg)" stroke="var(--code-border)" stroke-width="1"/>
<text x="340.0" y="362" text-anchor="middle" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600">Geen startbyte, geen lengteveld, geen opcode.</text>
<text x="340.0" y="382" text-anchor="middle" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">Buffer van 160 tekens; ArduinoSerialInterface speelt geen rol.</text>
</svg>
