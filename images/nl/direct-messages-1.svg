<text x="435" y="83" fill="#1F3864" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="central">7F</text>
<line x1="435" y1="102" x2="435" y2="520" stroke="var(--border-subtle)" stroke-width="1.2" stroke-dasharray="5,5"/>
<rect x="575.0" y="68" width="100" height="30" rx="4" fill="#D6E4F0" stroke="#2E75B6" stroke-width="1.4"/>
<text x="625" y="83" fill="#1F3864" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="central">PE1RDP</text>
<line x1="625" y1="102" x2="625" y2="520" stroke="var(--border-subtle)" stroke-width="1.2" stroke-dasharray="5,5"/>
<rect x="20" y="118" width="660" height="88" rx="8" fill="var(--card-bg)" stroke="var(--border-subtle)" stroke-width="1"/>
<text x="32" y="131" fill="#0F6E56" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="central">FASE 1 · pad onbekend</text>
<line x1="80" y1="166" x2="625" y2="166" stroke="#1E6B3A" stroke-width="3" marker-end="url(#arg)"/>
<rect x="264" y="155" width="22" height="22" rx="11" fill="#D9EFE2" stroke="#1E6B3A" stroke-width="1.8"/>
<rect x="424" y="155" width="22" height="22" rx="11" fill="#D9EFE2" stroke="#1E6B3A" stroke-width="1.8"/>
<text x="350.0" y="149" fill="#0F6E56" font-family="'JetBrains Mono',monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="central">TXT_MSG · flood · scope nl-ov-zwo</text>
<text x="350.0" y="191" fill="var(--text-secondary)" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central">elke repeater die de scope herkent stuurt door en plakt zijn hash achter het pad</text>
<rect x="20" y="214" width="660" height="88" rx="8" fill="var(--card-bg)" stroke="var(--border-subtle)" stroke-width="1"/>
<text x="32" y="227" fill="#0F6E56" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="central">FASE 2 · het pad komt terug</text>
<line x1="625" y1="262" x2="80" y2="262" stroke="#1E6B3A" stroke-width="3" marker-end="url(#arg)"/>
<rect x="264" y="251" width="22" height="22" rx="11" fill="#D9EFE2" stroke="#1E6B3A" stroke-width="1.8"/>
<rect x="424" y="251" width="22" height="22" rx="11" fill="#D9EFE2" stroke="#1E6B3A" stroke-width="1.8"/>
<text x="350.0" y="245" fill="#0F6E56" font-family="'JetBrains Mono',monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="central">PATH · flood · scope nl-ov-zwo</text>
<text x="350.0" y="287" fill="var(--text-secondary)" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central">draagt het afgelegde pad; PE1HVH bewaart het als out_path</text>
