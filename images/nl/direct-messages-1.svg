<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text-secondary)"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E6B3A"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E75B6"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8B0000"/></marker></defs>
<rect x="0" y="0" width="700" height="600" fill="var(--bg)"/>
<text x="350.0" y="26" fill="var(--heading-color)" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">Vier fasen van een DM</text>
<text x="350.0" y="48" fill="var(--text-secondary)" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central">PE1HVH → PE1RDP · fase 1 en 2 als flood mét scope · fase 3 en 4 direct, zonder transport codes</text>
<rect x="30.0" y="68" width="100" height="30" rx="4" fill="#D6E4F0" stroke="#2E75B6" stroke-width="1.4"/>
<text x="80" y="83" fill="#1F3864" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="central">PE1HVH</text>
<line x1="80" y1="102" x2="80" y2="520" stroke="var(--border-subtle)" stroke-width="1.2" stroke-dasharray="5,5"/>
<rect x="248.0" y="68" width="54" height="30" rx="4" fill="#D6E4F0" stroke="#2E75B6" stroke-width="1.4"/>
<text x="275" y="83" fill="#1F3864" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="central">A3</text>
