<text x="32" y="323" fill="#1F3864" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="central">FASE 3 · pad bekend</text>
<line x1="80" y1="358" x2="625" y2="358" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#arb)"/>
<rect x="264" y="347" width="22" height="22" rx="3" fill="#D6E4F0" stroke="#2E75B6" stroke-width="1.8"/>
<rect x="424" y="347" width="22" height="22" rx="3" fill="#D6E4F0" stroke="#2E75B6" stroke-width="1.8"/>
<text x="350.0" y="341" fill="#1F3864" font-family="'JetBrains Mono',monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="central">TXT_MSG · direct · pad A3 7F</text>
<text x="350.0" y="383" fill="var(--text-secondary)" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central">alleen A3 en 7F sturen door: hun hash staat vooraan in het pad</text>
<rect x="20" y="406" width="660" height="88" rx="8" fill="var(--card-bg)" stroke="var(--border-subtle)" stroke-width="1"/>
<text x="32" y="419" fill="#1F3864" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="central">FASE 4 · bevestiging</text>
<line x1="625" y1="454" x2="80" y2="454" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#arb)"/>
<rect x="264" y="443" width="22" height="22" rx="3" fill="#D6E4F0" stroke="#2E75B6" stroke-width="1.8"/>
<rect x="424" y="443" width="22" height="22" rx="3" fill="#D6E4F0" stroke="#2E75B6" stroke-width="1.8"/>
<text x="350.0" y="437" fill="#1F3864" font-family="'JetBrains Mono',monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="central">ACK · direct · 6 bytes</text>
<text x="350.0" y="479" fill="var(--text-secondary)" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central">terug langs hetzelfde pad, geen regiocontrole onderweg</text>
<line x1="30" y1="545" x2="76" y2="545" stroke="#1E6B3A" stroke-width="3"/>
<text x="84" y="545" fill="var(--text-secondary)" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="central">flood — iedereen die mag</text>
<line x1="320" y1="545" x2="366" y2="545" stroke="#2E75B6" stroke-width="1.8"/>
<text x="374" y="545" fill="var(--text-secondary)" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="central">direct — alleen het genoemde pad</text>
