<text fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" transform="rotate(-90,28,330)" x="28" y="330">FREQUENTIE (trede) ↑</text>
<!-- X-axis title -->
<text fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" x="360" y="670">SYMBOLEN (verzonden in volgorde) →</text>
