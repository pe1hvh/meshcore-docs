<!-- Symbool 1395: y = 630 - (1395/4095)*600 = 426 -->
<circle cx="380" cy="426" fill="var(--timeline-dot)" r="7"></circle>
<line opacity="0.4" stroke="var(--timeline-dot)" stroke-dasharray="3 3" stroke-width="1" x1="380" x2="380" y1="433" y2="630"></line>
<line opacity="0.4" stroke="var(--timeline-dot)" stroke-dasharray="3 3" stroke-width="1" x1="100" x2="373" y1="426" y2="426"></line>
<text fill="var(--timeline-dot)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" x="390" y="422">trede 1395</text>
