<text fill="var(--node)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" text-anchor="middle" x="540" y="652">Symbool 3</text>
<!-- Symbool 1350: y = 630 - (1350/4095)*600 = 432 -->
<circle cx="200" cy="432" fill="var(--link-color)" r="7"></circle>
<line opacity="0.4" stroke="var(--link-color)" stroke-dasharray="3 3" stroke-width="1" x1="200" x2="200" y1="439" y2="630"></line>
