<text x="35" y="217" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400" text-anchor="start">RADIO_CLASS en WRAPPER_CLASS worden in src/ en examples/ nergens gelezen</text>
