<rect x="0" y="0" width="680" height="336" fill="var(--bg)"/>

<title>Filter in the shared path against filter in the receive path only</title>

<text font-family="'JetBrains Mono',monospace" fill="var(--text-primary)" font-size="13" font-weight="600" x="30" y="26">A. Shared transmit and receive path</text>
<line stroke="var(--text-primary)" stroke-width="2" x1="70" x2="70" y1="48" y2="90"></line>
<line stroke="var(--text-primary)" stroke-width="1.6" x1="61" x2="79" y1="56" y2="56"></line>
<line stroke="var(--text-primary)" stroke-width="1.6" x1="63" x2="77" y1="64" y2="64"></line>
<text font-family="'JetBrains Mono',monospace" fill="var(--text-secondary)" font-size="11" text-anchor="middle" x="70" y="106">antenna</text>
<line stroke="var(--text-primary)" stroke-width="1.6" x1="84" x2="162" y1="68" y2="68"></line>
<path d="M160,64 L168,68 L160,72" fill="var(--text-primary)"></path>
<rect x="170" y="44" width="140" height="48" rx="5" fill="var(--card-bg)" stroke="var(--text-secondary)" stroke-width="1.2"></rect>
<text font-family="'JetBrains Mono',monospace" fill="var(--text-primary)" font-size="13" font-weight="600" text-anchor="middle" x="240.0" y="66.0">filter</text>
<text font-family="'JetBrains Mono',monospace" fill="var(--text-secondary)" font-size="11" text-anchor="middle" x="240.0" y="82.0">about 2 dB loss</text>
<line stroke="var(--text-primary)" stroke-width="1.6" x1="312" x2="390" y1="68" y2="68"></line>
<path d="M388,64 L396,68 L388,72" fill="var(--text-primary)"></path>
<rect x="398" y="44" width="130" height="48" rx="5" fill="var(--card-bg)" stroke="var(--text-secondary)" stroke-width="1.2"></rect>
<text font-family="'JetBrains Mono',monospace" fill="var(--text-primary)" font-size="13" font-weight="600" text-anchor="middle" x="463.0" y="72.0">SX1262</text>
<text font-family="'JetBrains Mono',monospace" fill="var(--text-secondary)" font-size="11" x="30" y="132">Simple, but the transmit power passes through the filter and must stay under its power limit.</text>
<line stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4 4" x1="30" x2="650" y1="156" y2="156"></line>
<text font-family="'JetBrains Mono',monospace" fill="var(--text-primary)" font-size="13" font-weight="600" x="30" y="186">B. Filter in the receive path only</text>
<line stroke="var(--text-primary)" stroke-width="2" x1="70" x2="70" y1="220" y2="262"></line>
<line stroke="var(--text-primary)" stroke-width="1.6" x1="61" x2="79" y1="228" y2="228"></line>
<line stroke="var(--text-primary)" stroke-width="1.6" x1="63" x2="77" y1="236" y2="236"></line>
<text font-family="'JetBrains Mono',monospace" fill="var(--text-secondary)" font-size="11" text-anchor="middle" x="70" y="278">antenna</text>
<line stroke="var(--text-primary)" stroke-width="1.6" x1="84" x2="122" y1="240" y2="240"></line>
<path d="M120,236 L128,240 L120,244" fill="var(--text-primary)"></path>
<rect x="130" y="216" width="120" height="48" rx="5" fill="var(--card-bg)" stroke="var(--text-secondary)" stroke-width="1.2"></rect>
<text font-family="'JetBrains Mono',monospace" fill="var(--text-primary)" font-size="13" font-weight="600" text-anchor="middle" x="190.0" y="244.0">RF switch</text>
<path d="M252,240 L278,240 L278,190 L306,190" fill="none" stroke="var(--text-primary)" stroke-width="1.6"></path>
<path d="M300,186 L308,190 L300,194" fill="var(--text-primary)"></path>
<path d="M450,190 L470,190 L470,240 L494,240" fill="none" stroke="var(--text-primary)" stroke-width="1.6"></path>
<path d="M252,240 L278,240 L278,290 L306,290" fill="none" stroke="var(--text-primary)" stroke-width="1.6"></path>
<path d="M300,286 L308,290 L300,294" fill="var(--text-primary)"></path>
<path d="M450,290 L470,290 L470,240 L494,240" fill="none" stroke="var(--text-primary)" stroke-width="1.6"></path>
<rect x="310" y="168" width="140" height="44" rx="5" fill="var(--card-bg)" stroke="var(--text-secondary)" stroke-width="1.2"></rect>
<text font-family="'JetBrains Mono',monospace" fill="var(--text-primary)" font-size="13" font-weight="600" text-anchor="middle" x="380.0" y="188.0">filter</text>
<text font-family="'JetBrains Mono',monospace" fill="var(--text-secondary)" font-size="11" text-anchor="middle" x="380.0" y="204.0">receive only</text>
<rect x="310" y="268" width="140" height="44" rx="5" fill="var(--card-bg)" stroke="var(--text-secondary)" stroke-width="1.2"></rect>
<text font-family="'JetBrains Mono',monospace" fill="var(--text-primary)" font-size="13" font-weight="600" text-anchor="middle" x="380.0" y="288.0">transmit path</text>
<text font-family="'JetBrains Mono',monospace" fill="var(--text-secondary)" font-size="11" text-anchor="middle" x="380.0" y="304.0">full power</text>
<path d="M488,236 L496,240 L488,244" fill="var(--text-primary)"></path>
<rect x="500" y="216" width="130" height="48" rx="5" fill="var(--card-bg)" stroke="var(--text-secondary)" stroke-width="1.2"></rect>
<text font-family="'JetBrains Mono',monospace" fill="var(--text-primary)" font-size="13" font-weight="600" text-anchor="middle" x="565.0" y="244.0">SX1262</text>
<text font-family="'JetBrains Mono',monospace" fill="var(--text-secondary)" font-size="11" x="30" y="326">Keeps full transmit power, at the cost of an extra switch and a control line from DIO2.</text>
</svg>
