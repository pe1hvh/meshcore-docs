<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs>
<rect x="0" y="0" width="700" height="400" fill="var(--bg)"/>
<rect x="190" y="20" width="320" height="56" rx="6" fill="var(--card-bg)" stroke="var(--node)" stroke-width="2"/>
<text x="350" y="44" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700">RADIO_CLASS</text>
<text x="350" y="63" text-anchor="middle" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">set per board, six wrappers</text>
<rect x="30" y="130" width="280" height="150" rx="6" fill="var(--flow-sw-fill)" stroke="var(--flow-sw-edge)" stroke-width="1.5"/>
<text x="170" y="156" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">SoC</text>
<text x="46" y="182" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">std_init()</text>
<text x="46" y="202" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">RadioLibWrapper</text>
<text x="46" y="222" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">noise floor over 64 samples</text>
<text x="46" y="242" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">clamped at -120 dBm</text>
<rect x="390" y="130" width="280" height="150" rx="6" fill="var(--flow-hw-fill)" stroke="var(--flow-hw-edge)" stroke-width="1.5"/>
<text x="530" y="156" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">SX1262</text>
<text x="406" y="182" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">begin() with LORA_FREQ/BW/SF</text>
<text x="406" y="202" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">TCXO 1.6 V or fallback 0.0</text>
<text x="406" y="222" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">register patch 0x8B5</text>
<text x="406" y="242" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">DIO2 as RF switch</text>
<line x1="310" y1="175" x2="390" y2="175" stroke="var(--line)" stroke-width="1.5" marker-end="url(#a)"/>
<text x="350" y="168" text-anchor="middle" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">SPI</text>
<line x1="390" y1="215" x2="310" y2="215" stroke="var(--line)" stroke-width="1.5" marker-end="url(#a)"/>
<text x="350" y="208" text-anchor="middle" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">DIO1</text>
<line x1="170" y1="76" x2="170" y2="130" stroke="var(--line)" stroke-width="1.5"/>
<line x1="530" y1="76" x2="530" y2="130" stroke="var(--line)" stroke-width="1.5"/>
<rect x="30" y="320" width="640" height="60" rx="6" fill="var(--code-bg)" stroke="var(--code-border)" stroke-width="1.5"/>
<text x="350" y="344" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">60 of 79 variant directories set SX126X_DIO2_AS_RF_SWITCH</text>
<text x="350" y="364" text-anchor="middle" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">the layer above knows only RADIO_CLASS</text>
