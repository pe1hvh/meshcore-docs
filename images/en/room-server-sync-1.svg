<svg style="width:100%;margin:1rem 0" viewBox="0 0 700 438" xmlns="http://www.w3.org/2000/svg">
<style>
:root{--bg:#FFFFFF; --grid:#023E8A; --line:#0096C7; --wave:#0096C7; --node:#0077B6; --outer:#0096C7; --text-primary:#0a2540; --text-secondary:#3d6380; --text-muted:#7a9bb5; --link-color:#0077B6; --link-hover:#023E8A; --heading-color:#0077B6; --border-subtle:rgba(0,119,182,0.12); --card-bg:rgba(0,119,182,0.03); --card-border:rgba(0,119,182,0.12); --card-hover:rgba(0,119,182,0.07); --code-bg:rgba(0,119,182,0.04); --code-border:rgba(0,119,182,0.12); --info-bg:rgba(0,119,182,0.04); --info-border:rgba(0,119,182,0.15); --table-header:rgba(0,119,182,0.06); --table-row-alt:rgba(0,119,182,0.02); --table-border:rgba(0,119,182,0.1); --timeline-line:#0096C7; --timeline-dot:#0077B6; --tag-green:rgba(16,185,129,0.1); --tag-green-text:#059669; --tag-red:rgba(239,68,68,0.08); --tag-red-text:#dc2626; --flow-hw:#b45309; --flow-hw-edge:#92400e; --flow-hw-fill:#fef3c7; --flow-hw-tint:#fffbeb; --flow-hw-text-soft:#78350f; --flow-hw-text-italic:#a16207; --flow-hw-divider:#d6a55c; --flow-sw:#1e40af; --flow-sw-edge:#1e3a8a; --flow-sw-fill:#dbeafe; --flow-sw-tint:#eff6ff; --flow-sw-divider:#93b8ff; --flow-warn:#b91c1c; --flow-warn-fill:#fee2e2; --flow-ok:#15803d; --flow-ink:#1c1917; --flow-ink-soft:#57534e; --flow-ink-mute:#78716c; --flow-bg-wait:#fafaf7; --flow-interface-bg:#f5f5f4; --flow-paper:#ffffff;}
@media (prefers-color-scheme: dark){:root{--bg:#0A1628; --grid:#0077B6; --line:#0077B6; --wave:#48CAE4; --node:#00B4D8; --outer:#0077B6; --text-primary:#e0f0f8; --text-secondary:#8badc4; --text-muted:#4a6a80; --link-color:#48CAE4; --link-hover:#90E0EF; --heading-color:#48CAE4; --border-subtle:rgba(0,119,182,0.15); --card-bg:rgba(0,119,182,0.06); --card-border:rgba(0,119,182,0.15); --card-hover:rgba(0,119,182,0.12); --code-bg:rgba(0,119,182,0.08); --code-border:rgba(0,119,182,0.2); --info-bg:rgba(72,202,228,0.06); --info-border:rgba(72,202,228,0.2); --table-header:rgba(0,119,182,0.1); --table-row-alt:rgba(0,119,182,0.04); --table-border:rgba(0,119,182,0.12); --timeline-line:#0077B6; --timeline-dot:#00B4D8; --tag-green:rgba(16,185,129,0.15); --tag-green-text:#6ee7b7; --tag-red:rgba(239,68,68,0.12); --tag-red-text:#fca5a5; --flow-hw:#b45309; --flow-hw-edge:#92400e; --flow-hw-fill:#fef3c7; --flow-hw-tint:#fffbeb; --flow-hw-text-soft:#78350f; --flow-hw-text-italic:#a16207; --flow-hw-divider:#d6a55c; --flow-sw:#1e40af; --flow-sw-edge:#1e3a8a; --flow-sw-fill:#dbeafe; --flow-sw-tint:#eff6ff; --flow-sw-divider:#93b8ff; --flow-warn:#b91c1c; --flow-warn-fill:#fee2e2; --flow-ok:#15803d; --flow-ink:#1c1917; --flow-ink-soft:#57534e; --flow-ink-mute:#78716c; --flow-bg-wait:#fafaf7; --flow-interface-bg:#f5f5f4; --flow-paper:#ffffff;}}
</style>
<rect x="0" y="0" width="700" height="438" fill="var(--bg)"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs>
<text x="20" y="32" text-anchor="start" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">posts[32] — cyclic queue</text>
<rect x="40" y="48" width="56" height="42" rx="4" fill="var(--flow-sw-fill)" stroke="var(--flow-sw-edge)" stroke-width="1.5"/>
<text x="68" y="74" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">t₄</text>
<rect x="100" y="48" width="56" height="42" rx="4" fill="var(--flow-sw-fill)" stroke="var(--flow-sw-edge)" stroke-width="1.5"/>
<text x="128" y="74" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">t₅</text>
<rect x="160" y="48" width="56" height="42" rx="4" fill="var(--flow-sw-fill)" stroke="var(--flow-sw-edge)" stroke-width="1.5"/>
<text x="188" y="74" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">t₆</text>
<rect x="220" y="48" width="56" height="42" rx="4" fill="var(--flow-sw-fill)" stroke="var(--flow-sw-edge)" stroke-width="1.5"/>
<text x="248" y="74" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">t₇</text>
<rect x="280" y="48" width="56" height="42" rx="4" fill="var(--flow-bg-wait)" stroke="var(--flow-ink-mute)" stroke-width="1.5"/>
<rect x="340" y="48" width="56" height="42" rx="4" fill="var(--flow-bg-wait)" stroke="var(--flow-ink-mute)" stroke-width="1.5"/>
<rect x="400" y="48" width="56" height="42" rx="4" fill="var(--flow-bg-wait)" stroke="var(--flow-ink-mute)" stroke-width="1.5"/>
<rect x="460" y="48" width="56" height="42" rx="4" fill="var(--flow-bg-wait)" stroke="var(--flow-ink-mute)" stroke-width="1.5"/>
<text x="40" y="106" text-anchor="start" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="400">oldest</text>
<line x1="288" y1="122" x2="288" y2="94" stroke="var(--line)" stroke-width="1.5" marker-end="url(#a)"/>
<text x="288" y="138" text-anchor="middle" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="400">next_post_idx</text>
<text x="516" y="106" text-anchor="middle" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="400">newest</text>
<line x1="20" y1="162" x2="680" y2="162" stroke="var(--border-subtle)" stroke-width="1"/>
<rect x="40" y="182" width="300" height="60" rx="6" fill="var(--flow-sw-fill)" stroke="var(--flow-sw-edge)" stroke-width="1.5"/>
<text x="190" y="206" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">PE1HVH  sync_since = t₅</text>
<text x="190" y="227" text-anchor="middle" fill="var(--flow-ok)" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="400">receives t₆ and t₇</text>
<rect x="360" y="182" width="300" height="60" rx="6" fill="var(--flow-sw-fill)" stroke="var(--flow-sw-edge)" stroke-width="1.5"/>
<text x="510" y="206" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">PE1RDP  sync_since = t₇</text>
<text x="510" y="227" text-anchor="middle" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="400">up to date — and t₇ is his own</text>
<text x="350" y="264" text-anchor="middle" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="400">round robin, one client per turn, 1200 ms</text>
<rect x="40" y="288" width="200" height="44" rx="6" fill="var(--code-bg)" stroke="var(--code-border)" stroke-width="1.5"/>
<text x="140" y="315" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">1. push one post</text>
<line x1="240" y1="310" x2="293" y2="310" stroke="var(--line)" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="253" y="288" width="200" height="44" rx="6" fill="var(--code-bg)" stroke="var(--code-border)" stroke-width="1.5"/>
<text x="353" y="315" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">2. wait for the ACK</text>
<line x1="453" y1="310" x2="506" y2="310" stroke="var(--line)" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="466" y="288" width="200" height="44" rx="6" fill="var(--code-bg)" stroke="var(--code-border)" stroke-width="1.5"/>
<text x="566" y="315" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">3. sync_since = that post’s t</text>
<rect x="40" y="350" width="620" height="42" rx="6" fill="var(--flow-warn-fill)" stroke="var(--flow-warn)" stroke-width="1.5"/>
<text x="350" y="377" text-anchor="middle" fill="var(--flow-warn)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">no ACK before the timeout  →  push_failures++, after 3 pushing stops</text>
<text x="350" y="418" text-anchor="middle" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">an author never gets his own post back</text>
</svg>