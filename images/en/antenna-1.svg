<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs>
<rect x="0" y="0" width="700" height="390" fill="var(--bg)"/>
<rect x="30" y="40" width="160" height="70" rx="6" fill="var(--flow-hw-fill)" stroke="var(--flow-hw-edge)" stroke-width="1.5"/>
<text x="110" y="70" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">SX1262</text>
<text x="110" y="90" text-anchor="middle" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">22 dBm typical</text>
<rect x="250" y="40" width="190" height="70" rx="6" fill="var(--flow-sw-fill)" stroke="var(--flow-sw-edge)" stroke-width="1.5"/>
<text x="345" y="70" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">RF switch</text>
<text x="345" y="90" text-anchor="middle" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">DIO2 / RXEN</text>
<rect x="500" y="40" width="170" height="70" rx="6" fill="var(--flow-hw-fill)" stroke="var(--flow-hw-edge)" stroke-width="1.5"/>
<text x="585" y="70" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">connector</text>
<text x="585" y="90" text-anchor="middle" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">SMA · IPEX/U.FL</text>
<line x1="190" y1="75" x2="250" y2="75" stroke="var(--line)" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="440" y1="75" x2="500" y2="75" stroke="var(--line)" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="30" y="160" width="640" height="90" rx="6" fill="var(--code-bg)" stroke="var(--code-border)" stroke-width="1.5"/>
<text x="350" y="186" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">two paths, one antenna</text>
<text x="50" y="212" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">transmit  chip -&gt; PA -&gt; switch -&gt; antenna</text>
<text x="50" y="232" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">receive   antenna -&gt; switch -&gt; LNA -&gt; chip</text>
<text x="50" y="252" text-anchor="start" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">DIO2=1, RXEN=0 -&gt; TX   |   DIO2=0, RXEN=1 -&gt; RX</text>
<rect x="30" y="290" width="640" height="70" rx="6" fill="var(--code-bg)" stroke="var(--code-border)" stroke-width="1.5"/>
<text x="350" y="316" text-anchor="middle" fill="var(--flow-ink)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">DIO2 as switch: 60 directories   separate RXEN/TXEN: 24</text>
<text x="350" y="340" text-anchor="middle" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="400">counted per variant directory, commented-out lines excluded</text>
</svg>